<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NFC Retro Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4caf50">
</head>
<body>
    <!-- Contenedor donde EmulatorJS inyectará el juego -->
    <div id="game"></div>

    <!-- Ajusta la variable --vh con la altura REAL visible (sin la barra de
         direcciones del navegador). Esto es más confiable que 100vh/100dvh
         solos en Android (Brave, Chrome, etc.), que es la causa de que los
         controles (cruceta y botones) aparecieran cortados abajo. -->
    <script>
        function setRealVH() {
            const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        setRealVH();
        window.addEventListener('resize', setRealVH);
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                setRealVH();
                window.dispatchEvent(new Event('resize'));
            }, 300);
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setRealVH);
        }
    </script>

    <!-- Configuración del Emulador -->
    <script>
        // Lee los parámetros de la URL para saber qué juego/consola cargar.
        // Ejemplo: ...?core=snes&rom=roms/super_mario_world.sfc&name=Super Mario World
        // Si no viene ningún parámetro, carga Pokémon Esmeralda por defecto (compatible
        // con el tag NFC que ya tienes grabado).
        const params = new URLSearchParams(window.location.search);

        EJS_player = '#game';
        EJS_core = params.get('core') || 'gba';
        EJS_gameName = params.get('name') || 'Pokémon Esmeralda';
        EJS_color = '#4caf50'; // Color verde esmeralda para la interfaz

        // IMPORTANTE: NO usamos EJS_startOnLoaded. Al forzar el arranque
        // automático, el navegador bloquea el audio (política de autoplay)
        // y el emulador se queda "atorado" hasta que el usuario hace clic
        // en cualquier parte varias veces sin querer -- eso es justo el bug
        // que describiste (PC: varios clics; celular: nunca arranca).
        // Dejando que EmulatorJS muestre su propio botón "Play" nativo, un
        // solo toque arranca el juego Y desbloquea el audio correctamente
        // en ambas plataformas.

        // Ruta al servidor en la nube de EmulatorJS
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        // Ruta a la ROM (por defecto, Pokémon Esmeralda)
        const romPath = params.get('rom') || 'roms/pokemon_emerald.gba';

        // "Cache buster" opcional: si el tag incluye &v=1, &v=2, etc.,
        // se agrega como ?v=1 al final de la ROM. Esto sirve para forzar
        // que el CDN de GitHub Pages traiga el archivo fresco en vez de
        // servir una versión (o un 404) que haya quedado en caché de
        // cuando el archivo todavía no existía.
        const cacheBuster = params.get('v');
        EJS_gameUrl = cacheBuster
            ? `${romPath}${romPath.includes('?') ? '&' : '?'}v=${cacheBuster}`
            : romPath;

        // Una vez que el juego arranca de verdad, forzamos un recálculo de
        // tamaño con la altura real -- así los controles táctiles quedan
        // bien posicionados incluso si la barra del navegador se movió
        // mientras cargaba.
        EJS_onGameStart = () => {
            setTimeout(() => window.dispatchEvent(new Event('resize')), 150);
        };
    </script>

    <!-- Este script es el que realmente arranca el emulador -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

    <!-- Service worker: cachea el emulador y la ROM para que la próxima vez
         cargue casi instantáneo, y para que Chrome pueda "instalar" esta
         página como app cuando el usuario la agregue a su pantalla de inicio -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
